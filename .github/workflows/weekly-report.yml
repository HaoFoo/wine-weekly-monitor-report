name: Weekly Wine Report

on:
  schedule:
    - cron: '0 2 * * 3' # Asia/Shanghai Wednesday 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate weekly report
        run: python scripts/auto_generate_report.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/reports
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-generate weekly report"
            git push
          fi
